name: runtime-vm-capability-probe

# Standalone, PR-only experiment. It is not the regular CI or S03/P0-01 gate.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/runtime-vm-capability.yml
      - ops/runtime/probes/github_runner_vm_capability.py
      - ops/runtime/tests/test_github_runner_vm_capability.py

permissions:
  contents: read

concurrency:
  group: runtime-vm-capability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guest-capability:
    # No forked PR payloads, no secrets, no production access.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22

    steps:
      - name: Checkout submitted PR source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Probe disposable KVM and isolated Ubuntu systemd Guest
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 ops/runtime/probes/github_runner_vm_capability.py \
            --output-dir "$RUNNER_TEMP/sanq-vm-capability" \
            --guest-timeout 460

      - name: Upload bounded capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanq-vm-capability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sanq-vm-capability/report.json
            ${{ runner.temp }}/sanq-vm-capability/guest-serial.log
            ${{ runner.temp }}/sanq-vm-capability/qemu-stderr.log
          if-no-files-found: warn
          retention-days: 7
