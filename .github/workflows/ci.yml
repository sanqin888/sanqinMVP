name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 先安装 pnpm。
      # 不指定 version，使用 package.json 中的 packageManager 版本。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # 再安装 Node，并启用 pnpm cache。
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api prisma:generate

      - name: Lint (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Build (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} build

      - name: Strict declaration check (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} exec tsc -p tsconfig.strict.json --pretty false

      - name: Strict declaration check (shared libraries)
        if: matrix.app == 'api'
        run: |
          pnpm --filter @shared/menu exec tsc -p tsconfig.strict.json --pretty false
          pnpm --filter @shared/order exec tsc -p tsconfig.strict.json --pretty false

      - name: Test (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api test

  uber-sandbox-smoke:
    name: Uber sandbox smoke

    # 只在代码真正 push 到 dev/main 后运行。
    # PR 阶段不向待合并代码暴露 Uber Sandbox 凭证。
    if: github.event_name == 'push'

    # 普通 CI 全部通过后，再访问真实 Uber Sandbox。
    needs: build-test

    runs-on: ubuntu-latest

    # 只有这个 job 可以访问 UberEats-Sandbox Environment secrets。
    # deployment: false 表示使用 Environment，但不创建 Deployment 记录。
    environment:
      name: UberEats-Sandbox
      deployment: false

    steps:
      - name: Check Uber sandbox credentials
        env:
          HAS_CLIENT_ID: ${{ secrets.UBER_SANDBOX_CLIENT_ID != '' }}
          HAS_CLIENT_SECRET: ${{ secrets.UBER_SANDBOX_CLIENT_SECRET != '' }}
          HAS_STORE_ID: ${{ secrets.UBER_SANDBOX_STORE_ID != '' }}
        run: |
          missing=()

          [[ "$HAS_CLIENT_ID" == "true" ]] || missing+=(UBER_SANDBOX_CLIENT_ID)
          [[ "$HAS_CLIENT_SECRET" == "true" ]] || missing+=(UBER_SANDBOX_CLIENT_SECRET)
          [[ "$HAS_STORE_ID" == "true" ]] || missing+=(UBER_SANDBOX_STORE_ID)

          if (( ${#missing[@]} > 0 )); then
            reason="Uber sandbox smoke cannot run: missing environment secrets: ${missing[*]}."

            echo "::error::$reason"

            echo "### Uber sandbox smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "Uber sandbox credentials are complete."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Uber sandbox smoke
        env:
          UBER_SANDBOX_CLIENT_ID: ${{ secrets.UBER_SANDBOX_CLIENT_ID }}
          UBER_SANDBOX_CLIENT_SECRET: ${{ secrets.UBER_SANDBOX_CLIENT_SECRET }}
          UBER_SANDBOX_STORE_ID: ${{ secrets.UBER_SANDBOX_STORE_ID }}
          UBER_SANDBOX_TOKEN_URL: ${{ vars.UBER_SANDBOX_TOKEN_URL }}
          UBER_SANDBOX_API_URL: ${{ vars.UBER_SANDBOX_API_URL }}
        run: pnpm --filter api test:uber-smoke
