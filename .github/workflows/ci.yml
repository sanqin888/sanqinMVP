name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Replace stale PR runs only. Each dev/main push keeps its own validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Preserve the Web check name; the API check is aggregated below.
    name: ${{ matrix.app == 'api' && 'api-checks' || 'build-test (web)' }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile SanQ MCP server
        if: matrix.app == 'api'
        run: python3 -m py_compile ops/sanq-mcp/server.py

      - name: Test SanQ MCP safety behavior
        if: matrix.app == 'api'
        run: python3 -m unittest discover -s ops/sanq-mcp/tests -p 'test_*.py'

      - name: Test backup operations safety behavior
        if: matrix.app == 'api'
        run: |
          bash -n ops/backup/backup-db.sh
          bash -n ops/backup/sanq-backup-protected-nginx
          python3 -m unittest discover -s ops/backup/tests -p 'test_*.py'

      # 先安装 pnpm。固定到仓库当前使用的 pnpm 9.0.0，避免 action-setup v6
      # 在 GitHub-hosted runner 上先 bootstrap 新版 pnpm 再降级所产生的分钟级波动。
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
          run_install: false

      # 再安装 Node，并启用 pnpm cache。
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared libraries
        run: |
          pnpm --filter @shared/foundation build &
          foundation_pid=$!
          pnpm --filter @shared/menu build &
          menu_pid=$!
          pnpm --filter @shared/order build &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Generate Prisma Client (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api prisma:generate

      - name: Architecture baseline gate
        if: matrix.app == 'api'
        run: node tools/architecture/scan-architecture.mjs --check

      - name: Lint (api)
        if: matrix.app == 'api'
        env:
          TIMING: "1"
        run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts" --concurrency=auto

      - name: Lint (web)
        if: matrix.app == 'web'
        run: pnpm --filter web lint

      - name: Build and strict declaration check (api)
        if: matrix.app == 'api'
        run: |
          # The Nest build and strict declaration program read the same prepared
          # source tree but produce independent outputs, so run them concurrently.
          (
            set -e
            time pnpm --filter api exec nest build
          ) > "${RUNNER_TEMP}/sanq-api-build.log" 2>&1 &
          build_pid=$!

          (
            set -e
            time pnpm --filter api exec tsc -p tsconfig.strict.json --pretty false
          ) > "${RUNNER_TEMP}/sanq-api-strict.log" 2>&1 &
          strict_pid=$!

          status=0
          wait "$build_pid" || status=1
          wait "$strict_pid" || status=1
          echo "::group::API Nest build"
          cat "${RUNNER_TEMP}/sanq-api-build.log"
          echo "::endgroup::"
          echo "::group::API strict declaration check"
          cat "${RUNNER_TEMP}/sanq-api-strict.log"
          echo "::endgroup::"
          exit "$status"

      - name: Build (web)
        if: matrix.app == 'web'
        env:
          SANQ_CI_EXTERNAL_STATIC_CHECKS: "1"
        run: pnpm --filter web exec next build --turbopack

      - name: Strict declaration check (web)
        if: matrix.app == 'web'
        run: pnpm --filter web exec tsc -p tsconfig.strict.json --pretty false

      - name: Strict declaration check (shared libraries)
        if: matrix.app == 'api'
        run: |
          pnpm --filter @shared/foundation exec tsc -p tsconfig.strict.json --pretty false &
          foundation_pid=$!
          pnpm --filter @shared/menu exec tsc -p tsconfig.strict.json --pretty false &
          menu_pid=$!
          pnpm --filter @shared/order exec tsc -p tsconfig.strict.json --pretty false &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Test (web)
        if: matrix.app == 'web'
        run: pnpm --filter web test

  api-tests:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared libraries
        run: |
          pnpm --filter @shared/foundation build &
          foundation_pid=$!
          pnpm --filter @shared/menu build &
          menu_pid=$!
          pnpm --filter @shared/order build &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Test (api)
        id: api_jest
        run: pnpm --filter api exec jest --json --outputFile="${RUNNER_TEMP}/sanq-api-jest-results.json"

      - name: Summarize API Jest suite timings
        if: ${{ always() && !cancelled() && steps.api_jest.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';

          const reportPath = join(process.env.RUNNER_TEMP, 'sanq-api-jest-results.json');
          if (!existsSync(reportPath)) {
            console.log('Jest did not produce a timing report; inspect the test step logs.');
          } else {
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const suites = report.testResults
              .map((suite) => ({
                name: relative(process.cwd(), suite.name),
                seconds: (suite.endTime - suite.startTime) / 1000,
              }))
              .filter((suite) => Number.isFinite(suite.seconds) && suite.seconds >= 0)
              .sort((left, right) => right.seconds - left.seconds)
              .slice(0, 20);
            const lines = [
              '### API Jest: 20 slowest suites',
              '',
              'Suite wall-clock durations include setup and transform work.',
              '',
              '| Suite | Seconds |',
              '| --- | ---: |',
              ...suites.map((suite) => '| ' + suite.name + ' | ' + suite.seconds.toFixed(3) + ' |'),
              '',
            ];
            const summary = lines.join('\n');
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          }
          NODE

      - name: Upload API Jest timing report
        if: ${{ always() && !cancelled() && steps.api_jest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-jest-timings
          path: ${{ runner.temp }}/sanq-api-jest-results.json
          if-no-files-found: ignore
          retention-days: 7

  api-validation:
    # Keep the existing required API check tied to both parallel lanes.
    name: build-test (api)
    needs: [build-test, api-tests]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3

    steps:
      - name: Require static checks and full API tests to succeed
        env:
          STATIC_CHECKS_RESULT: ${{ needs['build-test'].result }}
          API_TESTS_RESULT: ${{ needs['api-tests'].result }}
        run: |
          if [[ "$STATIC_CHECKS_RESULT" != "success" || "$API_TESTS_RESULT" != "success" ]]; then
            echo "Static checks: $STATIC_CHECKS_RESULT; API tests: $API_TESTS_RESULT"
            exit 1
          fi

  browser-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sanq_e2e
          POSTGRES_PASSWORD: sanq_e2e
          POSTGRES_DB: sanq_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanq_e2e -d sanq_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sanq_e2e:sanq_e2e@127.0.0.1:5432/sanq_e2e
      SANQ_E2E: "1"
      SANQ_E2E_STAFF_PASSWORD: a5-e2e-staff-password
      SANQ_E2E_POS_ENROLLMENT_CODE: a5-e2e-pos-enrollment
      SANQ_E2E_D2_POS_ENROLLMENT_CODE: a5-d2-e2e-pos-enrollment
      SANQ_E2E_D3_POS_ENROLLMENT_CODE: a5-d3-e2e-pos-enrollment
      STORE_ID: e2e_store
      COOKIE_SIGNING_SECRET: a5-e2e-cookie-signing-secret
      OTP_SECRET: a5-e2e-otp-secret
      PHONE_VERIFICATION_SECRET: a5-e2e-phone-verification-secret
      MEMBER_RECHARGE_OTP_SECRET: a5-e2e-member-recharge-secret
      CLOVER_PRICING_TOKEN_SECRET: a5-e2e-pricing-token-secret
      SMS_PROVIDER: log
      EMAIL_PROVIDER: log
      GOOGLE_CLIENT_ID: a5-e2e-google-client-id
      GOOGLE_CLIENT_SECRET: a5-e2e-google-client-secret
      GOOGLE_OAUTH_CALLBACK_URL: http://127.0.0.1:8080/api/v1/auth/oauth/google/callback
      PUBLIC_BASE_URL: https://e2e.invalid
      UBER_EATS_RATE_LIMITER_MODE: database
      UBER_EATS_OAUTH_STATE_SECRET: a5-e2e-uber-oauth-state-secret-0123456789-ABCDEF
      UBER_EATS_WEBHOOK_SIGNING_KEY_ACTIVE: a5-e2e-uber-webhook-signing-key
      UBER_CREDENTIAL_KEYS_SOURCE: env
      UBER_CREDENTIAL_ACTIVE_KEY_VERSION: "1"
      UBER_CREDENTIAL_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      API_UPSTREAM: http://127.0.0.1:4000
      SANQ_E2E_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared libraries
        run: |
          pnpm --filter @shared/foundation build &
          foundation_pid=$!
          pnpm --filter @shared/menu build &
          menu_pid=$!
          pnpm --filter @shared/order build &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Prepare browser, API, and Web in parallel
        run: |
          # All three branches are independent clean-build prerequisites. Keep
          # them in one step so every child exit code and full log is preserved.
          (
            set -e
            echo "Install Playwright Chromium headless shell"
            time pnpm --filter web exec playwright install --with-deps --only-shell chromium
          ) > "${RUNNER_TEMP}/sanq-e2e-browser-prepare.log" 2>&1 &
          browser_pid=$!

          (
            set -e
            echo "Generate Prisma Client"
            time pnpm --filter api prisma:generate
            echo "Replay committed migrations into disposable E2E database"
            time pnpm --filter api exec prisma migrate deploy
            echo "Seed deterministic E2E fixtures"
            time NODE_ENV=test pnpm --filter api e2e:seed
            echo "Build API"
            time pnpm --filter api exec nest build
          ) > "${RUNNER_TEMP}/sanq-e2e-api-prepare.log" 2>&1 &
          api_pid=$!

          (
            set -e
            echo "Build production Web"
            time NODE_ENV=production SANQ_CI_EXTERNAL_STATIC_CHECKS=1 pnpm --filter web exec next build --turbopack
          ) > "${RUNNER_TEMP}/sanq-e2e-web-prepare.log" 2>&1 &
          web_pid=$!

          status=0
          wait "$browser_pid" || status=1
          wait "$api_pid" || status=1
          wait "$web_pid" || status=1
          echo "::group::Browser preparation"
          cat "${RUNNER_TEMP}/sanq-e2e-browser-prepare.log"
          echo "::endgroup::"
          echo "::group::API and database preparation"
          cat "${RUNNER_TEMP}/sanq-e2e-api-prepare.log"
          echo "::endgroup::"
          echo "::group::Production Web build"
          cat "${RUNNER_TEMP}/sanq-e2e-web-prepare.log"
          echo "::endgroup::"
          exit "$status"

      - name: Start API
        env:
          NODE_ENV: test
          PORT: "4000"
          UPLOAD_ROOT: ${{ runner.temp }}/sanq-e2e-uploads
        run: |
          nohup pnpm --filter api exec node --enable-source-maps dist/main.js > "${RUNNER_TEMP}/sanq-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/sanq-api.log"
          exit 1

      - name: Start production Web
        env:
          NODE_ENV: production
        run: |
          nohup pnpm --filter web exec next start -p 8080 -H 127.0.0.1 > "${RUNNER_TEMP}/sanq-web.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/sanq-web.log"
          exit 1

      - name: Verify Web BFF reaches API readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/ready >/dev/null

      - name: Browser E2E
        env:
          SANQ_E2E_API_LOG: ${{ runner.temp }}/sanq-api.log
        run: pnpm --filter web test:e2e

      - name: Upload browser E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/sanq-api.log
            ${{ runner.temp }}/sanq-web.log
            ${{ runner.temp }}/sanq-e2e-browser-prepare.log
            ${{ runner.temp }}/sanq-e2e-api-prepare.log
            ${{ runner.temp }}/sanq-e2e-web-prepare.log

  printer-agent:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/printer-server/package-lock.json

      - name: Install printer-agent dependencies
        run: npm ci --prefix tools/printer-server

      - name: Printer-agent smoke test
        run: npm test --prefix tools/printer-server

  windows-workstation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Windows workstation launcher
        shell: powershell
        run: .\tools\windows-pos-workstation\validate.ps1
