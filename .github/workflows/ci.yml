name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile SanQ MCP server
        if: matrix.app == 'api'
        run: python3 -m py_compile ops/sanq-mcp/server.py

      # 先安装 pnpm。
      # 不指定 version，使用 package.json 中的 packageManager 版本。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # 再安装 Node，并启用 pnpm cache。
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js CI cache
        if: matrix.app == 'web'
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'libs/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared libraries
        run: |
          pnpm --filter @shared/foundation build &
          foundation_pid=$!
          pnpm --filter @shared/menu build &
          menu_pid=$!
          pnpm --filter @shared/order build &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Generate Prisma Client (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api prisma:generate

      - name: Architecture baseline gate
        if: matrix.app == 'api'
        run: node tools/architecture/scan-architecture.mjs --check

      - name: Lint (api)
        if: matrix.app == 'api'
        run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts" --concurrency=auto

      - name: Lint (web)
        if: matrix.app == 'web'
        run: pnpm --filter web lint

      - name: Build (api)
        if: matrix.app == 'api'
        run: pnpm --filter api exec nest build

      - name: Build (web)
        if: matrix.app == 'web'
        env:
          SANQ_CI_EXTERNAL_STATIC_CHECKS: "1"
        run: pnpm --filter web exec next build --turbopack

      - name: Save Next.js CI cache
        if: matrix.app == 'web' && success()
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'libs/**') }}

      - name: Strict declaration check (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} exec tsc -p tsconfig.strict.json --pretty false

      - name: Strict declaration check (shared libraries)
        if: matrix.app == 'api'
        run: |
          pnpm --filter @shared/foundation exec tsc -p tsconfig.strict.json --pretty false &
          foundation_pid=$!
          pnpm --filter @shared/menu exec tsc -p tsconfig.strict.json --pretty false &
          menu_pid=$!
          pnpm --filter @shared/order exec tsc -p tsconfig.strict.json --pretty false &
          order_pid=$!

          status=0
          wait "$foundation_pid" || status=1
          wait "$menu_pid" || status=1
          wait "$order_pid" || status=1
          exit "$status"

      - name: Test (api)
        if: matrix.app == 'api'
        run: pnpm --filter api exec jest

      - name: Test (web)
        if: matrix.app == 'web'
        run: pnpm --filter web test
