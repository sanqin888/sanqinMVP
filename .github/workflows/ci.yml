name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      UBER_SANDBOX_CONFIGURED: ${{ secrets.UBER_SANDBOX_CLIENT_ID != '' && secrets.UBER_SANDBOX_CLIENT_SECRET != '' && secrets.UBER_SANDBOX_STORE_ID != '' }}
      UBER_SANDBOX_SMOKE_REQUIRED: ${{ vars.UBER_SANDBOX_SMOKE_REQUIRED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - uses: actions/checkout@v6

      # ✅ 先装 pnpm（不要写 version，避免与 packageManager 冲突）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # ✅ 再装 Node，并启用 pnpm cache（此时 pnpm 已存在）
      - name: Setup Node (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api prisma:generate

      - name: Lint (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Build (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} build

      - name: Strict declaration check (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} exec tsc -p tsconfig.strict.json --pretty false

      - name: Strict declaration check (shared libraries)
        if: matrix.app == 'api'
        run: |
          pnpm --filter @shared/menu exec tsc -p tsconfig.strict.json --pretty false
          pnpm --filter @shared/order exec tsc -p tsconfig.strict.json --pretty false

      - name: Test (api only)
        if: matrix.app == 'api'
        run: pnpm --filter api test

      - name: Check Uber sandbox smoke credentials
        if: matrix.app == 'api'
        id: uber-smoke
        env:
          HAS_CLIENT_ID: ${{ secrets.UBER_SANDBOX_CLIENT_ID != '' }}
          HAS_CLIENT_SECRET: ${{ secrets.UBER_SANDBOX_CLIENT_SECRET != '' }}
          HAS_STORE_ID: ${{ secrets.UBER_SANDBOX_STORE_ID != '' }}
        run: |
          if [[ "$UBER_SANDBOX_CONFIGURED" == "true" ]]; then
            echo "Uber sandbox credentials are complete; the smoke test will run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          [[ "$HAS_CLIENT_ID" == "true" ]] || missing+=(UBER_SANDBOX_CLIENT_ID)
          [[ "$HAS_CLIENT_SECRET" == "true" ]] || missing+=(UBER_SANDBOX_CLIENT_SECRET)
          [[ "$HAS_STORE_ID" == "true" ]] || missing+=(UBER_SANDBOX_STORE_ID)
          reason="Uber sandbox smoke skipped: missing dedicated credentials: ${missing[*]}."
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$reason"
          echo "### Uber sandbox smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$UBER_SANDBOX_SMOKE_REQUIRED" == "true" ]]; then
            echo "::error::Uber sandbox smoke is required for this branch/environment, but its credentials are incomplete."
            exit 1
          fi

      - name: Uber sandbox smoke (dedicated credentials only)
        if: >-
          matrix.app == 'api' &&
          steps.uber-smoke.outputs.run == 'true'
        env:
          UBER_SANDBOX_CLIENT_ID: ${{ secrets.UBER_SANDBOX_CLIENT_ID }}
          UBER_SANDBOX_CLIENT_SECRET: ${{ secrets.UBER_SANDBOX_CLIENT_SECRET }}
          UBER_SANDBOX_STORE_ID: ${{ secrets.UBER_SANDBOX_STORE_ID }}
          UBER_SANDBOX_TOKEN_URL: ${{ vars.UBER_SANDBOX_TOKEN_URL }}
          UBER_SANDBOX_API_URL: ${{ vars.UBER_SANDBOX_API_URL }}
        run: pnpm --filter api test:uber-smoke
