x-ubereats-runtime: &ubereats-runtime
  UBER_EATS_RATE_LIMITER_MODE: "database"
  UBER_EATS_APP_SCOPES: "eats.store eats.order eats.store.status.write"
  UBER_EATS_USER_AUTH_SCOPES: "eats.pos_provisioning"
  # These values are populated from the deployment VM's environment/.env file.
  UBER_CREDENTIAL_ENCRYPTION_KEYS: ${UBER_CREDENTIAL_ENCRYPTION_KEYS}
  UBER_CREDENTIAL_ACTIVE_KEY_VERSION: ${UBER_CREDENTIAL_ACTIVE_KEY_VERSION}
  UBER_CREDENTIAL_KEYS_SOURCE: "env"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sanqin_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      <<: *ubereats-runtime
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sanqin_db"
      PORT: 4000
      UPLOAD_ROOT: "/app/uploads"
      TZ: "America/Toronto"
      STORE_ID: "4750_Yonge_Street"
      COOKIE_SIGNING_SECRET: ${COOKIE_SIGNING_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WEB_BASE_URL: "https://sanq.ca"
      PUBLIC_BASE_URL: "https://sanq.ca"
      SALES_TAX_RATE: "0.13"
      CORS_ORIGIN: "https://sanq.ca,https://www.sanq.ca"
      GOOGLE_CLIENT_ID: "99749299344-bohhqb4i1322lbgjq894ak0n49t8clpb.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      GOOGLE_OAUTH_CALLBACK_URL: "https://api.sanq.ca/api/v1/auth/oauth/google/callback"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      STORE_LATITUDE: "43.760288"
      STORE_LONGITUDE: "-79.412167"
      UBER_DIRECT_CUSTOMER_ID: "248a2a0d-cf94-4ed9-8be5-a6e4fca57b9a"
      UBER_DIRECT_CLIENT_ID: "2wrtMDlnXM7BXZ0E-z9NrGhJjNapyN3F"
      UBER_DIRECT_CLIENT_SECRET: ${UBER_DIRECT_CLIENT_SECRET}
      UBER_DIRECT_API_BASE: "https://api.uber.com"
      UBER_DIRECT_OAUTH_URL: "https://auth.uber.com/oauth/v2/token"
      UBER_DIRECT_STORE_BUSINESS_NAME: "SanQ Roujiamo"
      UBER_DIRECT_STORE_CONTACT: "San Qin"
      UBER_DIRECT_STORE_PHONE: "+1-437-808-6888"
      UBER_DIRECT_STORE_ADDRESS_LINE1: "4750 Yonge St."
      UBER_DIRECT_STORE_ADDRESS_LINE2: "Unit 138"
      UBER_DIRECT_STORE_CITY: "Toronto"
      UBER_DIRECT_STORE_PROVINCE: "ON"
      UBER_DIRECT_STORE_POSTAL_CODE: "M2N 5M6"
      UBER_DIRECT_STORE_COUNTRY: "CA"
      UBER_EATS_CLIENT_ID: ${UBER_EATS_CLIENT_ID}
      UBER_EATS_WEBHOOK_SIGNING_KEY: ${UBER_EATS_WEBHOOK_SIGNING_KEY}
      UBER_EATS_CLIENT_SECRET: ${UBER_EATS_CLIENT_SECRET}
      UBER_EATS_AUTHORIZE_ENDPOINT: ${UBER_EATS_AUTHORIZE_ENDPOINT}
      UBER_EATS_TOKEN_ENDPOINT: ${UBER_EATS_TOKEN_ENDPOINT}
      UBER_EATS_API_BASE_URL: ${UBER_EATS_API_BASE_URL}
      UBER_EATS_RESOURCE_HREF_ALLOWED_ORIGINS: "https://api.uber.com"
      UBER_EATS_REDIRECT_URI: "https://api.sanq.ca/api/v1/integrations/ubereats/oauth/callback"
      UBER_EATS_OAUTH_STATE_SECRET: ${UBER_EATS_OAUTH_STATE_SECRET}
      UBER_EATS_WORKER_ENABLED: "false"
      CLOVER_BASE: "https://scl.clover.com"
      CLOVER_MERCHANT_ID: "XC3DQ9Z7D4YJ1"
      CLOVER_ACCESS_TOKEN: ${CLOVER_ACCESS_TOKEN}
      CLOVER_V3_ACCESS_TOKEN: ${CLOVER_V3_ACCESS_TOKEN}
      SMS_PROVIDER: "twilio"
      AWS_REGION: "ca-central-1"
      AWS_SMS_ORIGINATION_IDENTITY: ${AWS_SMS_ORIGINATION_IDENTITY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EMAIL_PROVIDER: "sendgrid"
      AWS_SES_FROM_EMAIL: "no-reply@sanq.ca"
      AWS_SES_REGION: "ca-central-1"
      AWS_SES_CONFIGURATION_SET: "sanq-events"
      SNS_TOPIC_ARN: "arn:aws:sns:ca-central-1:328944069269:sanqin-order-events-prod"
      SES_EVENTS_SQS_QUEUE_URL: "https://sqs.ca-central-1.amazonaws.com/328944069269/ses-events-queue"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
      SENDGRID_FROM_ADDRESS: "no-reply@sanq.ca"
      SENDGRID_FROM_NAME: "SanQ"
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: "${SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_FROM_NUMBER: "+14374756090"
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:5555:5555"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
  ubereats-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "apps/api/dist/ubereats-worker.main.js"]
    restart: always
    environment:
      <<: *ubereats-runtime
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sanqin_db"
      TZ: "America/Toronto"
      WEB_BASE_URL: "https://sanq.ca"
      PUBLIC_BASE_URL: "https://sanq.ca"
      UBER_EATS_WORKER_ENABLED: "true"
      UBER_EATS_WORKER_HEALTH_PORT: 4001
      UBER_EATS_CLIENT_ID: ${UBER_EATS_CLIENT_ID}
      UBER_EATS_CLIENT_SECRET: ${UBER_EATS_CLIENT_SECRET}
      UBER_EATS_API_BASE_URL: ${UBER_EATS_API_BASE_URL}
      UBER_EATS_TOKEN_ENDPOINT: ${UBER_EATS_TOKEN_ENDPOINT}
      UBER_EATS_AUTHORIZE_ENDPOINT: ${UBER_EATS_AUTHORIZE_ENDPOINT}
      UBER_EATS_REDIRECT_URI: "https://api.sanq.ca/api/v1/integrations/ubereats/oauth/callback"
      UBER_EATS_OAUTH_STATE_SECRET: ${UBER_EATS_OAUTH_STATE_SECRET}
      UBER_EATS_WEBHOOK_SIGNING_KEY: ${UBER_EATS_WEBHOOK_SIGNING_KEY}
      UBER_EATS_RESOURCE_HREF_ALLOWED_ORIGINS: "https://api.uber.com"
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_GOOGLE_MAPS_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        - NEXT_PUBLIC_CLOVER_PUBLIC_TOKEN=${NEXT_PUBLIC_CLOVER_PUBLIC_TOKEN}
        - NEXT_PUBLIC_CLOVER_SDK_URL=${NEXT_PUBLIC_CLOVER_SDK_URL}
        - NEXT_PUBLIC_CLOVER_MERCHANT_ID=${CLOVER_MERCHANT_ID}
    volumes:
      - /home/ubuntu/sanq-assets/sounds:/app/apps/web/public/sounds:ro
    restart: always
    environment:
      API_UPSTREAM: "http://api:4000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
