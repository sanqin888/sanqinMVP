x-ubereats-runtime: &ubereats-runtime
  UBER_EATS_RATE_LIMITER_MODE: "database"
  UBER_EATS_WORKER_WAKE_URL: "http://ubereats-worker:4001"
  UBER_EATS_APP_SCOPES: "eats.store eats.order eats.store.status.write eats.report"
  UBER_EATS_USER_AUTH_SCOPES: "eats.pos_provisioning"
  UBER_EATS_FINANCIAL_AUTHORITY_ENABLED: "${UBER_EATS_FINANCIAL_AUTHORITY_ENABLED:-false}"
  # These values are populated from the deployment VM's environment/.env file.
  UBER_CREDENTIAL_ENCRYPTION_KEYS: ${UBER_CREDENTIAL_ENCRYPTION_KEYS}
  UBER_CREDENTIAL_ACTIVE_KEY_VERSION: ${UBER_CREDENTIAL_ACTIVE_KEY_VERSION}
  UBER_CREDENTIAL_KEYS_SOURCE: "env"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sanqin_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  api:
    image: ghcr.io/sanqin888/sanq-api:${SANQ_IMAGE_SHA:?SANQ_IMAGE_SHA is required}
    restart: always
    environment:
      <<: *ubereats-runtime
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sanqin_db"
      PORT: 4000
      UPLOAD_ROOT: "/app/uploads"
      TZ: "America/Toronto"
      STORE_ID: "4750_Yonge_Street"
      COOKIE_SIGNING_SECRET: ${COOKIE_SIGNING_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WEB_BASE_URL: "https://sanq.ca"
      PUBLIC_BASE_URL: "https://sanq.ca"
      OTP_SECRET: "${OTP_SECRET:?OTP_SECRET is required}"
      PHONE_VERIFICATION_SECRET: "${PHONE_VERIFICATION_SECRET:?PHONE_VERIFICATION_SECRET is required}"
      MEMBER_RECHARGE_OTP_SECRET: "${MEMBER_RECHARGE_OTP_SECRET:?MEMBER_RECHARGE_OTP_SECRET is required}"
      SALES_TAX_RATE: "0.13"
      CORS_ORIGIN: "https://sanq.ca,https://www.sanq.ca"
      GOOGLE_CLIENT_ID: "99749299344-bohhqb4i1322lbgjq894ak0n49t8clpb.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      GOOGLE_OAUTH_CALLBACK_URL: "https://api.sanq.ca/api/v1/auth/oauth/google/callback"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      METEOSTAT_RAPIDAPI_KEY: "${METEOSTAT_RAPIDAPI_KEY:-}"
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:?GOOGLE_MAPS_BROWSER_KEY is required}
      STORE_LATITUDE: "43.760288"
      STORE_LONGITUDE: "-79.412167"
      UBER_DIRECT_CUSTOMER_ID: "248a2a0d-cf94-4ed9-8be5-a6e4fca57b9a"
      UBER_DIRECT_CLIENT_ID: "2wrtMDlnXM7BXZ0E-z9NrGhJjNapyN3F"
      UBER_DIRECT_CLIENT_SECRET: ${UBER_DIRECT_CLIENT_SECRET}
      UBER_DIRECT_API_BASE: "https://api.uber.com"
      UBER_DIRECT_OAUTH_URL: "https://auth.uber.com/oauth/v2/token"
      UBER_DIRECT_STORE_BUSINESS_NAME: "SanQ Roujiamo"
      UBER_DIRECT_STORE_CONTACT: "San Qin"
      UBER_DIRECT_STORE_PHONE: "+1-437-808-6888"
      UBER_DIRECT_STORE_ADDRESS_LINE1: "4750 Yonge St."
      UBER_DIRECT_STORE_ADDRESS_LINE2: "Unit 138"
      UBER_DIRECT_STORE_CITY: "Toronto"
      UBER_DIRECT_STORE_PROVINCE: "ON"
      UBER_DIRECT_STORE_POSTAL_CODE: "M2N 5M6"
      UBER_DIRECT_STORE_COUNTRY: "CA"
      UBER_EATS_CLIENT_ID: ${UBER_EATS_CLIENT_ID}
      UBER_EATS_WEBHOOK_SIGNING_KEY: ${UBER_EATS_WEBHOOK_SIGNING_KEY}
      UBER_EATS_CLIENT_SECRET: ${UBER_EATS_CLIENT_SECRET}
      UBER_EATS_AUTHORIZE_ENDPOINT: ${UBER_EATS_AUTHORIZE_ENDPOINT}
      UBER_EATS_TOKEN_ENDPOINT: ${UBER_EATS_TOKEN_ENDPOINT}
      UBER_EATS_API_BASE_URL: ${UBER_EATS_API_BASE_URL}
      UBER_EATS_RESOURCE_HREF_ALLOWED_ORIGINS: "https://api.uber.com"
      UBER_EATS_REDIRECT_URI: "https://api.sanq.ca/api/v1/integrations/ubereats/oauth/callback"
      UBER_EATS_OAUTH_STATE_SECRET: ${UBER_EATS_OAUTH_STATE_SECRET}
      UBER_EATS_WORKER_ENABLED: "false"
      CLOVER_BASE: "https://scl.clover.com"
      CLOVER_MERCHANT_ID: "XC3DQ9Z7D4YJ1"
      CLOVER_WEB_PUBLIC_TOKEN: ${CLOVER_WEB_PUBLIC_TOKEN:?CLOVER_WEB_PUBLIC_TOKEN is required}
      CLOVER_WEB_SDK_URL: ${CLOVER_WEB_SDK_URL:?CLOVER_WEB_SDK_URL is required}
      CLOVER_UNIFIED_MERCHANT_ID: "${CLOVER_UNIFIED_MERCHANT_ID:-}"
      CLOVER_UNIFIED_STORE_STABLE_ID: "${CLOVER_UNIFIED_STORE_STABLE_ID:-}"
      CLOVER_UNIFIED_PLATFORM_API_BASE: "${CLOVER_UNIFIED_PLATFORM_API_BASE:-}"
      CLOVER_ACCESS_TOKEN: ${CLOVER_ACCESS_TOKEN}
      CLOVER_UNIFIED_OAUTH_CLIENT_ID: "${CLOVER_UNIFIED_OAUTH_CLIENT_ID:-}"
      CLOVER_UNIFIED_OAUTH_CLIENT_SECRET: "${CLOVER_UNIFIED_OAUTH_CLIENT_SECRET:-}"
      CLOVER_UNIFIED_OAUTH_AUTHORIZE_BASE: "${CLOVER_UNIFIED_OAUTH_AUTHORIZE_BASE:-}"
      CLOVER_UNIFIED_OAUTH_API_BASE: "${CLOVER_UNIFIED_OAUTH_API_BASE:-}"
      CLOVER_UNIFIED_OAUTH_CALLBACK_URL: "${CLOVER_UNIFIED_OAUTH_CALLBACK_URL:-}"
      CLOVER_UNIFIED_OAUTH_SCOPES: "${CLOVER_UNIFIED_OAUTH_SCOPES:-}"
      CLOVER_TERMINAL_API_BASE: "${CLOVER_TERMINAL_API_BASE:-}"
      CLOVER_TERMINAL_DEVICE_ID: "${CLOVER_TERMINAL_DEVICE_ID:-}"
      CLOVER_TERMINAL_REMOTE_APP_ID: "${CLOVER_TERMINAL_REMOTE_APP_ID:-}"
      CLOVER_TERMINAL_TIMEOUT_SECONDS: "${CLOVER_TERMINAL_TIMEOUT_SECONDS:-}"
      CLOVER_CREDENTIAL_ACTIVE_KEY_VERSION: "${CLOVER_CREDENTIAL_ACTIVE_KEY_VERSION:-}"
      CLOVER_CREDENTIAL_ENCRYPTION_KEYS: "${CLOVER_CREDENTIAL_ENCRYPTION_KEYS:-}"
      CLOVER_CREDENTIAL_KEYS_SOURCE: "${CLOVER_CREDENTIAL_KEYS_SOURCE:-}"
      CLOVER_WEBHOOK_AUTH_CODE: "${CLOVER_WEBHOOK_AUTH_CODE:-}"
      SMS_PROVIDER: "twilio"
      AWS_REGION: "ca-central-1"
      ACCOUNTING_TEXTRACT_ENABLED: "${ACCOUNTING_TEXTRACT_ENABLED:-false}"
      AWS_SMS_ORIGINATION_IDENTITY: ${AWS_SMS_ORIGINATION_IDENTITY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EMAIL_PROVIDER: "sendgrid"
      AWS_SES_FROM_EMAIL: "no-reply@sanq.ca"
      AWS_SES_REGION: "ca-central-1"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
      SENDGRID_FROM_ADDRESS: "no-reply@sanq.ca"
      SENDGRID_FROM_NAME: "SanQ"
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: "${SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_FROM_NUMBER: "+14374756090"
      ACCOUNTING_GMAIL_ADDRESS: "${ACCOUNTING_GMAIL_ADDRESS:-bills@sanq.ca}"
      ACCOUNTING_GMAIL_CLIENT_ID: "${ACCOUNTING_GMAIL_CLIENT_ID:-}"
      ACCOUNTING_GMAIL_CLIENT_SECRET: "${ACCOUNTING_GMAIL_CLIENT_SECRET:-}"
      ACCOUNTING_GMAIL_REFRESH_TOKEN: "${ACCOUNTING_GMAIL_REFRESH_TOKEN:-}"
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:5555:5555"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
  ubereats-worker:
    image: ghcr.io/sanqin888/sanq-api:${SANQ_IMAGE_SHA:?SANQ_IMAGE_SHA is required}
    command: ["node", "apps/api/dist/ubereats-worker.main.js"]
    restart: always
    environment:
      <<: *ubereats-runtime
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/sanqin_db"
      UPLOAD_ROOT: "/app/uploads"
      TZ: "America/Toronto"
      WEB_BASE_URL: "https://sanq.ca"
      PUBLIC_BASE_URL: "https://sanq.ca"
      UBER_EATS_WORKER_ENABLED: "true"
      UBER_EATS_WORKER_WAKE_FALLBACK_POLL_INTERVAL_MS: "30000"
      UBER_EATS_WORKER_HEALTH_PORT: 4001
      UBER_EATS_CLIENT_ID: ${UBER_EATS_CLIENT_ID}
      UBER_EATS_CLIENT_SECRET: ${UBER_EATS_CLIENT_SECRET}
      UBER_EATS_API_BASE_URL: ${UBER_EATS_API_BASE_URL}
      UBER_EATS_TOKEN_ENDPOINT: ${UBER_EATS_TOKEN_ENDPOINT}
      UBER_EATS_AUTHORIZE_ENDPOINT: ${UBER_EATS_AUTHORIZE_ENDPOINT}
      UBER_EATS_REDIRECT_URI: "https://api.sanq.ca/api/v1/integrations/ubereats/oauth/callback"
      UBER_EATS_OAUTH_STATE_SECRET: ${UBER_EATS_OAUTH_STATE_SECRET}
      UBER_EATS_WEBHOOK_SIGNING_KEY: ${UBER_EATS_WEBHOOK_SIGNING_KEY}
      UBER_EATS_RESOURCE_HREF_ALLOWED_ORIGINS: "https://api.uber.com"
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
  web:
    image: ghcr.io/sanqin888/sanq-web:${SANQ_IMAGE_SHA:?SANQ_IMAGE_SHA is required}
    volumes:
      - /home/ubuntu/sanq-assets/sounds:/app/apps/web/public/sounds:ro
    restart: always
    environment:
      API_UPSTREAM: "http://api:4000"
      PUBLIC_BASE_URL: "https://sanq.ca"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      api:
        condition: service_started
volumes:
  pgdata:
